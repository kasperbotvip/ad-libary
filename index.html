<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaspar Ads Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-md mx-auto space-y-6">
        <h1 class="text-2xl font-bold text-blue-400 text-center">أداة البحث عن الإعلانات</h1>
        
        <div>
            <label class="block text-sm text-gray-400 mb-2">الكلمة المفتاحية</label>
            <input id="keyword" type="text" class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 focus:border-blue-500 outline-none" placeholder="مثال: سيارات، عقارات...">
        </div>

        <div>
            <label class="block text-sm text-gray-400 mb-2">الدولة</label>
            <select id="country" class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700">
                <option value="IQ">العراق 🇮🇶</option>
                <option value="EG">مصر 🇪🇬</option>
                <option value="SA">السعودية 🇸🇦</option>
                <option value="AE">الإمارات 🇦🇪</option>
            </select>
        </div>

        <button onclick="search()" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-bold transition">بحث في فيسبوك</button>
    </div>

    <script>
        // دالة البحث
        function search() {
            const kw = document.getElementById('keyword').value;
            const co = document.getElementById('country').value;
            if(!kw) return alert("يرجى كتابة كلمة للبحث");
            
            const url = `https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=${co}&q=${encodeURIComponent(kw)}`;
            
            // فتح فيسبوك داخل تطبيق التلغرام
            window.Telegram.WebApp.openLink(url);
        }
    </script>
</body>
</html>
