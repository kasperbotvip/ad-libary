<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>body{background:#0f172a; color:white; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:sans-serif;}</style>
</head>
<body>
    <div id="status">جاري التحويل لمكتبة الإعلانات...</div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const params = new URLSearchParams(window.location.search);
        const co = params.get('country');
        const q = params.get('q');

        if (co && q) {
            const url = `https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=${co}&q=${encodeURIComponent(q)}`;
            window.location.href = url;
        } else {
            document.getElementById('status').innerText = "خطأ في البيانات.";
        }
    </script>
</body>
</html>
