<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // قراءة البيانات المرسلة من البوت
    const urlParams = new URLSearchParams(window.location.search);
    const country = urlParams.get('country');
    const q = urlParams.get('q');

    // إذا كانت هناك بيانات، قم بالبحث تلقائياً
    if (country && q) {
        const fbUrl = `https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=${country}&q=${encodeURIComponent(q)}`;
        tg.openLink(fbUrl);
    }
</script>
